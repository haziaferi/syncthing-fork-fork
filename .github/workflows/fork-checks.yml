name: Fork checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  resources:
    name: Fork checks / resources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s .github/scripts -p "test_fork_resource_check.py"
      - name: Check fork resources
        run: python .github/scripts/fork_resource_check.py --base "origin/${{ github.base_ref || 'main' }}"
